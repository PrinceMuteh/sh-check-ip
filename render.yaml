services:
  - type: web
    name: safehaven-ip-checker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: TOOL_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
